# Weekly version updates for the root library's npm dependencies and the
# SHA-pinned actions in CI. The private demo/ app is intentionally not covered.
version: 2

updates:
  # Root library package: runtime dependencies (the shipped surface) and the
  # build/test/lint toolchain, grouped separately.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      library-runtime:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      library-tooling:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions in CI. The workflows pin actions to commit SHAs; Dependabot
  # PRs bump the SHA and the version comment beside it.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
