# Weekly version updates for the npm workspace graph and SHA-pinned CI actions.
version: 2

updates:
  # Dependabot resolves every workspace from the single root lockfile. Groups
  # keep independent framework stacks in separate pull requests.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      library-runtime:
        patterns:
          - "@noble/*"
          - "@scure/*"
          - "react-native-passkey"
          - "viem"
        update-types:
          - "minor"
          - "patch"
      vite-demos:
        patterns:
          - "@playwright/test"
          - "@vitejs/*"
          - "vite"
          - "vitest"
        update-types:
          - "minor"
          - "patch"
      expo-mobile:
        patterns:
          - "@expo/*"
          - "@react-native/*"
          - "expo"
          - "expo-*"
          - "react-native"
          - "react-native-*"
        update-types:
          - "minor"
          - "patch"
      astro-docs:
        patterns:
          - "@astrojs/*"
          - "@ec-ts/*"
          - "@expressive-code/*"
          - "astro"
          - "expressive-code"
          - "expressive-code-*"
          - "sharp"
          - "unist-util-visit"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions in CI. The workflows pin actions to commit SHAs; Dependabot
  # PRs bump the SHA and the version comment beside it.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
