name: Mera - Docs Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - demo/**
      - prf-demo/**
      - src/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/docs-pages.yml
  workflow_dispatch:

# Keep a publishing deployment running while replacing any older queued run
# with the latest docs build.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
            prf-demo/package-lock.json

      # The demo build writes to docs/public/demo, which the site serves at
      # /demo/. The PRF model writes to docs/public/prf-demo. The library has
      # to exist first because both apps compile against dist/.
      - name: Build the demos into the site
        run: |
          npm ci
          npm run build
          npm --prefix demo ci
          npm --prefix demo run build
          npm --prefix prf-demo ci
          npm --prefix prf-demo run test
          npm --prefix prf-demo run build

      - name: Build and upload docs
        uses: withastro/action@v6
        with:
          path: docs
          node-version: 24
          # The action restores node_modules/.astro from any older commit's
          # cache; a stale content-layer store makes the build emit module
          # imports that no longer resolve. The cache only holds optimized
          # remote images, which this site does not use.
          cache: "false"
        env:
          DOCS_SITE: https://mera.category.xyz

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
