name: Mera - Docs Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/docs-pages.yml
  workflow_dispatch:

# Keep a publishing deployment running while replacing any older queued run
# with the latest docs build.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build and upload docs
        uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6.1.2
        with:
          path: docs
          node-version: 24
          # The action restores node_modules/.astro from any older commit's
          # cache; a stale content-layer store makes the build emit module
          # imports that no longer resolve. The cache only holds optimized
          # remote images, which this site does not use.
          cache: "false"
        env:
          DOCS_SITE: https://mera.category.xyz

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
