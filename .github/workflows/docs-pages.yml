name: Mera - Docs Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - demos/web/**
      - demos/prf/**
      - library/**
      - package.json
      - package-lock.json
      - .nvmrc
      - .github/workflows/docs-pages.yml
  workflow_dispatch:

# Keep a publishing deployment running while replacing any older queued run
# with the latest docs build.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use repository npm version
        run: corepack enable npm

      - name: Install dependencies
        run: npm ci --include-workspace-root -w library -w demos/web -w demos/prf -w docs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # Astro's cache stays disabled. Restoring an older content-layer store can
      # emit module imports that no longer resolve, and this site does not use
      # the optimized remote-image cache.
      - name: Build site
        run: npm run build:site
        env:
          DOCS_SITE: https://mera.category.xyz

      - name: Upload site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/dist

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
