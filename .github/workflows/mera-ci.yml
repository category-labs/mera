name: Mera - CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel superseded runs when a PR branch gets a new push. Runs on main are
# queued instead of cancelled so post-merge validation always completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Classifies a PR's changed files so later jobs can skip unrelated work. Push
  # and manual runs execute every gated job.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      library: ${{ steps.filter.outputs.library }}
      demo: ${{ steps.filter.outputs.demo }}
      mobile: ${{ steps.filter.outputs.mobile }}
      package: ${{ steps.filter.outputs.package }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Filter changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.url }}
        run: |
          gh api --paginate "$PR_URL/files" --jq '.[].filename' > changed-files.txt

          matches() { grep -qE "$1" changed-files.txt && echo true || echo false; }
          graph='^(package\.json|package-lock\.json|\.nvmrc|\.github/workflows/)'
          library="^library/|$graph"
          packaged='^(LICENSE-MIT|LICENSE-APACHE)$'

          {
            echo "library=$(matches "$library")"
            echo "demo=$(matches "$library|^demos/(web|extension|prf)/")"
            echo "mobile=$(matches "$library|^demos/mobile/")"
            echo "package=$(matches "$library|$packaged")"
            echo "docs=$(matches "$library|^docs/")"
          } >> "$GITHUB_OUTPUT"

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use repository npm version
        run: corepack enable npm

      - name: Install dependencies
        run: npm ci --workspaces=false

      - name: Run Biome checks
        run: npm run check

  test:
    name: Test
    runs-on: ubuntu-latest
    # On non-PR events `changes` is skipped, which would skip dependents too;
    # `!cancelled()` keeps them eligible so the event check can run everything.
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.library == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use repository npm version
        run: corepack enable npm

      - name: Install dependencies
        run: npm ci --include-workspace-root -w @category-labs/mera

      - name: Install Playwright browser
        run: npm exec -w @category-labs/mera -- playwright install --with-deps chromium

      - name: Run tests
        run: npm test

  demo:
    name: Demos
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.demo == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use repository npm version
        run: corepack enable npm

      - name: Install dependencies
        run: npm ci --include-workspace-root -w @category-labs/mera -w mera-demo -w mera-demo-extension -w mera-prf-demo

      - name: Install Playwright browser
        run: npm exec -w mera-demo-extension -- playwright install --with-deps chromium

      - name: Test demos
        run: npm run test:demos

  mobile:
    name: Mobile demo
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.mobile == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use repository npm version
        run: corepack enable npm

      - name: Install dependencies
        run: npm ci --include-workspace-root -w @category-labs/mera -w mera-demo-mobile

      - name: Check mobile demo
        run: npm run check:mobile

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use repository npm version
        run: corepack enable npm

      - name: Install dependencies
        run: npm ci --include-workspace-root -w @category-labs/mera -w mera-docs

      - name: Audit docs dependencies
        # Expo/Metro currently reports advisories with no nonbreaking fix.
        continue-on-error: true
        run: npm audit -w mera-docs --audit-level=moderate

      - name: Build docs
        run: npm run check:docs

  package:
    name: Publish check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.package == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use repository npm version
        run: corepack enable npm

      - name: Install dependencies
        run: npm ci --include-workspace-root -w @category-labs/mera

      - name: Verify package contents, exports, and types
        run: npm run check:pack
