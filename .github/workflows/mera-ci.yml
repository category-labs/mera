name: Mera - CI

on:
  push:
    branches:
      - main
    paths:
      - "mera/**"
      - ".github/workflows/mera-ci.yml"
  pull_request:
    paths:
      - "mera/**"
      - ".github/workflows/mera-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: mera/.nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: mera/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mera

      - name: Run lint
        run: npm run lint
        working-directory: mera

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: mera/.nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: mera/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mera

      - name: Check formatting
        run: npm exec -- biome format .
        working-directory: mera

  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: mera/.nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: mera/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mera

      - name: Compile library
        run: npm run build
        working-directory: mera

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: mera/.nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: mera/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mera

      - name: Install Playwright browser
        run: npm exec -- playwright install --with-deps chromium
        working-directory: mera

      - name: Run tests
        run: npm test
        working-directory: mera

  demo:
    name: Demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: mera/.nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: |
            mera/package-lock.json
            mera/demo/package-lock.json

      - name: Install library dependencies
        run: npm ci
        working-directory: mera

      - name: Build library
        run: npm run build
        working-directory: mera

      - name: Install demo dependencies
        run: npm ci
        working-directory: mera/demo

      - name: Build demo
        run: npm run build
        working-directory: mera/demo
