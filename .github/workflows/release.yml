name: Mera - Release

# Publishes @category-labs/mera to npm with provenance, building and publishing
# in one GitHub-hosted job so the attestation certifies the artifact was built
# here. A v* tag publishes for real; workflow_dispatch runs a dry-run.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm (provenance)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require a public repository (provenance prerequisite)
        if: github.event.repository.private
        run: |
          echo "::error::Repository is private. npm provenance requires a public repo; make it public before releasing."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use repository npm version
        run: corepack enable npm

      - name: Install dependencies
        run: npm ci --include-workspace-root -w library

      - name: Verify package
        run: npm run check:pack

      - name: Validate release version and refuse to republish
        run: |
          name=$(node -p "require('./library/package.json').name")
          version=$(node -p "require('./library/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${version}."
            exit 1
          fi
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "::error::${name}@${version} is already published. Bump the version."
            exit 1
          fi

      - name: Publish
        run: npm publish -w library --provenance

  dry-run:
    name: Dry-run publish (no registry write)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Use repository npm version
        run: corepack enable npm

      - name: Install dependencies
        run: npm ci --include-workspace-root -w library

      - name: Verify package
        run: npm run check:pack

      - name: Publish (dry-run)
        # npm 12 otherwise rejects the already-published version during a
        # nonwriting dry run.
        run: npm publish -w library --dry-run --force
