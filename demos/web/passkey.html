<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="#f5f6f8" name="theme-color">
    <link href="https://api.fontshare.com" rel="preconnect">
    <link crossorigin href="https://cdn.fontshare.com" rel="preconnect">
    <!-- no-referrer: Fontshare rejects requests bearing a localhost referer,
         which would leave local dev on the fallback fonts -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@1&display=swap"
      referrerpolicy="no-referrer"
      rel="stylesheet"
    >
    <title>Sign in to the extension</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/extensionPasskey.tsx" type="module"></script>
  </body>
</html>
