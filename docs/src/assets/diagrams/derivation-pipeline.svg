<svg
  class="mera-diagram"
  height="536"
  role="img"
  viewBox="0 0 640 536"
  width="640"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>
    Pipeline from entropy to an address. Entropy, encoded as a seed phrase by
    BIP-39, derives a seed, then a private key via a derivation path, then a
    public key via a one-way function, then an address. The entropy, seed
    phrase, seed, and private key are secret; the public key and address are
    safe to share.
  </title>
  <defs>
    <marker
      id="dp-arrow"
      markerHeight="7"
      markerWidth="7"
      orient="auto-start-reverse"
      refX="8"
      refY="5"
      viewBox="0 0 10 10"
    >
      <path class="d-head" d="M0 0 L10 5 L0 10 z" />
    </marker>
  </defs>

  <!-- entropy and its BIP-39 phrase encoding -->
  <rect class="d-secret" height="56" rx="8" width="220" x="30" y="24" />
  <text text-anchor="middle" x="140" y="57">Entropy</text>

  <rect class="d-secret" height="56" rx="8" width="210" x="400" y="24" />
  <text text-anchor="middle" x="505" y="57">Seed phrase</text>

  <path
    class="d-edge d-dashed"
    d="M258 52 H392"
    marker-end="url(#dp-arrow)"
    marker-start="url(#dp-arrow)"
  />
  <text class="d-note" text-anchor="middle" x="325" y="42">BIP-39</text>

  <!-- the derivation spine -->
  <path class="d-edge" d="M140 80 V126" marker-end="url(#dp-arrow)" />
  <text class="d-note" x="152" y="107">key derivation (KDF)</text>

  <rect class="d-secret" height="56" rx="8" width="220" x="30" y="132" />
  <text text-anchor="middle" x="140" y="165">Seed</text>

  <path class="d-edge" d="M140 188 V234" marker-end="url(#dp-arrow)" />
  <text class="d-note" x="152" y="205">BIP-32 / SLIP-0010 derivation</text>
  <text class="d-mono" x="152" y="223">m/44'/60'/0'/0/0</text>

  <rect class="d-secret" height="56" rx="8" width="220" x="30" y="240" />
  <text text-anchor="middle" x="140" y="273">Private key</text>

  <path class="d-edge" d="M140 296 V342" marker-end="url(#dp-arrow)" />
  <text class="d-note" x="152" y="323">one-way function</text>

  <rect class="d-node" height="56" rx="8" width="220" x="30" y="348" />
  <text text-anchor="middle" x="140" y="381">Public key</text>

  <path class="d-edge" d="M140 404 V450" marker-end="url(#dp-arrow)" />
  <text class="d-note" x="152" y="431">encoding</text>

  <rect class="d-node" height="56" rx="8" width="220" x="30" y="456" />
  <text text-anchor="middle" x="140" y="489">Address</text>

  <!-- legend -->
  <rect class="d-secret" height="14" rx="3" width="14" x="402" y="152" />
  <text class="d-note" x="424" y="164">secret material</text>
  <rect class="d-node" height="14" rx="3" width="14" x="402" y="182" />
  <text class="d-note" x="424" y="194">safe to share</text>
</svg>
