<svg
  class="mera-diagram"
  height="516"
  role="img"
  viewBox="0 0 680 516"
  width="680"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>
    The recipe's two flows. On the first visit, createPasskeyWithPrfOutput
    creates the passkey and the app stores the credential metadata, credentialId
    and transports, which holds no key material. On a returning visit,
    getPasskeyPrfOutput signs in using the stored metadata. The PRF output
    becomes the seed through BIP-39, held in memory for the session, and HD
    derivation by index produces the EVM and Solana signing sessions, ended by
    end().
  </title>
  <defs>
    <marker
      id="fr-arrow"
      markerHeight="7"
      markerWidth="7"
      orient="auto-start-reverse"
      refX="8"
      refY="5"
      viewBox="0 0 10 10"
    >
      <path class="d-head" d="M0 0 L10 5 L0 10 z" />
    </marker>
  </defs>

  <!-- first visit -->
  <rect class="d-zone" height="216" rx="10" width="296" x="24" y="24" />
  <text class="d-sub" x="38" y="46">first visit</text>

  <rect class="d-node" height="56" rx="8" width="248" x="48" y="56" />
  <text text-anchor="middle" x="172" y="80">Create the passkey</text>
  <text class="d-mono" text-anchor="middle" x="172" y="99">
    createPasskeyWithPrfOutput
  </text>

  <path class="d-edge" d="M172 112 V156" marker-end="url(#fr-arrow)" />

  <rect class="d-node" height="56" rx="8" width="248" x="48" y="160" />
  <text text-anchor="middle" x="172" y="193">Credential metadata</text>

  <!-- the stored record feeds the later sign-in -->
  <path
    class="d-edge d-dashed"
    d="M296 188 L378 92"
    marker-end="url(#fr-arrow)"
  />

  <!-- returning visit -->
  <rect class="d-zone" height="476" rx="10" width="296" x="360" y="24" />
  <text class="d-sub" x="374" y="46">returning visit</text>

  <rect class="d-node" height="56" rx="8" width="248" x="384" y="56" />
  <text text-anchor="middle" x="508" y="80">Sign in</text>
  <text class="d-mono" text-anchor="middle" x="508" y="99">
    getPasskeyPrfOutput
  </text>

  <path class="d-edge" d="M508 112 V156" marker-end="url(#fr-arrow)" />

  <rect class="d-secret" height="56" rx="8" width="248" x="384" y="160" />
  <text text-anchor="middle" x="508" y="193">PRF output</text>

  <path class="d-edge" d="M508 216 V260" marker-end="url(#fr-arrow)" />
  <text class="d-sub" x="520" y="242">BIP-39</text>

  <rect class="d-secret" height="56" rx="8" width="248" x="384" y="264" />
  <text text-anchor="middle" x="508" y="297">Seed</text>

  <path class="d-edge" d="M508 320 V364" marker-end="url(#fr-arrow)" />
  <text class="d-sub" x="520" y="346">derivation by index</text>

  <rect class="d-secret" height="64" rx="8" width="248" x="384" y="368" />
  <text text-anchor="middle" x="508" y="405">Signing sessions</text>

  <path class="d-edge" d="M508 432 V476" marker-end="url(#fr-arrow)" />
  <text class="d-mono" x="520" y="458">end()</text>
</svg>
