<svg
  class="mera-diagram"
  height="88"
  role="img"
  viewBox="0 0 784 88"
  width="784"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>
    The pipeline from a passkey to a signature. A sign-in ceremony returns 32
    secret bytes, the same bytes on every sign-in. mera derives a private key
    from them. A signing session holds the key and produces signatures.
  </title>
  <defs>
    <marker
      id="gs-arrow"
      markerHeight="7"
      markerWidth="7"
      orient="auto-start-reverse"
      refX="8"
      refY="5"
      viewBox="0 0 10 10"
    >
      <path class="d-head" d="M0 0 L10 5 L0 10 z" />
    </marker>
  </defs>

  <rect class="d-node" height="56" rx="8" width="136" x="4" y="16" />
  <text text-anchor="middle" x="72" y="49">Sign in</text>

  <path class="d-edge" d="M140 44 H160" marker-end="url(#gs-arrow)" />

  <rect class="d-secret" height="56" rx="8" width="136" x="164" y="16" />
  <text text-anchor="middle" x="232" y="49">32 secret bytes</text>

  <path class="d-edge" d="M300 44 H320" marker-end="url(#gs-arrow)" />

  <rect class="d-secret" height="56" rx="8" width="136" x="324" y="16" />
  <text text-anchor="middle" x="392" y="49">Derive a key</text>

  <path class="d-edge" d="M460 44 H480" marker-end="url(#gs-arrow)" />

  <rect class="d-secret" height="56" rx="8" width="136" x="484" y="16" />
  <text text-anchor="middle" x="552" y="49">Signing session</text>

  <path class="d-edge" d="M620 44 H640" marker-end="url(#gs-arrow)" />

  <rect class="d-node" height="56" rx="8" width="136" x="644" y="16" />
  <text text-anchor="middle" x="712" y="49">Signature</text>
</svg>
