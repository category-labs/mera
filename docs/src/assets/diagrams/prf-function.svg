<svg
  class="mera-diagram"
  height="416"
  role="img"
  viewBox="0 0 680 416"
  width="680"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>
    The PRF as a function. The relying party ID and a salt enter the
    authenticator, where the credential and the PRF live; the PRF returns 32
    bytes of output. The same credential, relying party ID, and salt produce the
    same 32 bytes on every synced device; a different salt produces unrelated
    output.
  </title>
  <defs>
    <marker
      id="pf-arrow"
      markerHeight="7"
      markerWidth="7"
      orient="auto-start-reverse"
      refX="8"
      refY="5"
      viewBox="0 0 10 10"
    >
      <path class="d-head" d="M0 0 L10 5 L0 10 z" />
    </marker>
  </defs>

  <!-- inputs supplied by the ceremony -->
  <rect class="d-node" height="56" rx="8" width="190" x="140" y="24" />
  <text text-anchor="middle" x="235" y="48">Relying party ID</text>
  <text class="d-mono" text-anchor="middle" x="235" y="67">
    account.example.com
  </text>

  <rect class="d-node" height="56" rx="8" width="190" x="350" y="24" />
  <text text-anchor="middle" x="445" y="48">Salt</text>
  <text class="d-sub" text-anchor="middle" x="445" y="67">
    32 bytes, a namespace
  </text>

  <path class="d-edge" d="M235 80 L410 143" marker-end="url(#pf-arrow)" />
  <path class="d-edge" d="M445 80 L455 143" marker-end="url(#pf-arrow)" />

  <!-- the authenticator holds the credential and evaluates the PRF -->
  <rect class="d-zone" height="128" rx="10" width="400" x="140" y="118" />
  <text class="d-sub" x="156" y="140">authenticator</text>

  <rect class="d-secret" height="56" rx="8" width="190" x="156" y="150" />
  <text text-anchor="middle" x="251" y="174">Credential</text>
  <text class="d-sub" text-anchor="middle" x="251" y="193">
    never leaves the authenticator
  </text>

  <path class="d-edge" d="M346 178 H372" marker-end="url(#pf-arrow)" />

  <rect class="d-node" height="56" rx="8" width="144" x="380" y="150" />
  <text text-anchor="middle" x="452" y="174">PRF</text>
  <text class="d-sub" text-anchor="middle" x="452" y="193">deterministic</text>

  <path class="d-edge" d="M452 206 V282" marker-end="url(#pf-arrow)" />

  <rect class="d-secret" height="56" rx="8" width="180" x="362" y="286" />
  <text text-anchor="middle" x="452" y="310">PRF output</text>
  <text class="d-sub" text-anchor="middle" x="452" y="329">
    32 bytes, stable
  </text>

  <text class="d-note" text-anchor="middle" x="340" y="380">
    The same credential, rpId, and salt produce the same 32 bytes on every
    synced device.
  </text>
  <text class="d-note" text-anchor="middle" x="340" y="402">
    A different salt produces unrelated output: salts are namespaces.
  </text>
</svg>
