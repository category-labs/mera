<svg
  class="mera-diagram"
  height="432"
  role="img"
  viewBox="200 0 440 432"
  width="440"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>
    The signing session lifecycle. A private key, derived, decrypted, or
    imported, is consumed when the session is created. The live session holds
    the only copy of the key and signs on request. Calling end() zeroes the
    session's key copy; the ended state is permanent, and a new signature needs
    a new session.
  </title>
  <defs>
    <marker
      id="sl-arrow"
      markerHeight="7"
      markerWidth="7"
      orient="auto-start-reverse"
      refX="8"
      refY="5"
      viewBox="0 0 10 10"
    >
      <path class="d-head" d="M0 0 L10 5 L0 10 z" />
    </marker>
  </defs>

  <rect class="d-secret" height="56" rx="8" width="200" x="220" y="24" />
  <text text-anchor="middle" x="320" y="57">Private key</text>

  <path class="d-edge" d="M320 80 V164" marker-end="url(#sl-arrow)" />
  <text class="d-sub" x="332" y="126">create the session</text>

  <rect class="d-secret" height="64" rx="16" width="200" x="220" y="168" />
  <text text-anchor="middle" x="320" y="205">Live</text>

  <path
    class="d-edge"
    d="M420 184 C 480 184, 480 216, 420 216"
    marker-end="url(#sl-arrow)"
  />
  <text class="d-sub" x="490" y="203">signs on request</text>

  <path class="d-edge" d="M320 232 V344" marker-end="url(#sl-arrow)" />
  <text class="d-mono" x="332" y="292">end()</text>

  <rect class="d-node" height="64" rx="16" width="200" x="220" y="348" />
  <text text-anchor="middle" x="320" y="385">Ended</text>
</svg>
