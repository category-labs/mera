<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 476"
  width="640"
  height="476"
  role="img"
  class="mera-diagram"
>
  <title>
    The signing session lifecycle. A private key, derived, decrypted, or
    imported, is consumed at construction: the session keeps the only
    library-side copy and zeroes the input buffer, even on throw. The unlocked
    session signs on request with no prompts; while unlocked, a compromised
    runtime can request signatures. Calling lock(), which using disposal also
    calls at scope exit, zeroes the session's key copy. The locked state is
    permanent: signing after lock() throws SESSION_LOCKED, and a new signature
    needs a new session.
  </title>
  <defs>
    <marker
      id="sl-arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M0 0 L10 5 L0 10 z" class="d-head" />
    </marker>
  </defs>

  <rect class="d-secret" x="220" y="24" width="200" height="56" rx="8" />
  <text x="320" y="48" text-anchor="middle">Private key</text>
  <text x="320" y="67" text-anchor="middle" class="d-sub">
    derived, decrypted, or imported
  </text>

  <path class="d-edge" d="M320 80 V164" marker-end="url(#sl-arrow)" />
  <text x="332" y="112" class="d-sub">construction consumes the key;</text>
  <text x="332" y="130" class="d-sub">
    the input buffer is zeroed, even on throw
  </text>

  <rect class="d-secret" x="220" y="168" width="200" height="64" rx="16" />
  <text x="320" y="194" text-anchor="middle">Unlocked</text>
  <text x="320" y="213" text-anchor="middle" class="d-sub">
    holds the only library-side copy
  </text>

  <path
    class="d-edge"
    d="M420 184 C 480 184, 480 216, 420 216"
    marker-end="url(#sl-arrow)"
  />
  <text x="490" y="194" class="d-mono">signDigest / sign</text>
  <text x="490" y="212" class="d-sub">no prompts</text>

  <text x="24" y="186" class="d-sub">while unlocked, a</text>
  <text x="24" y="204" class="d-sub">compromised runtime</text>
  <text x="24" y="222" class="d-sub">can request signatures</text>

  <path class="d-edge" d="M320 232 V344" marker-end="url(#sl-arrow)" />
  <text x="332" y="280" class="d-mono">lock()</text>
  <text x="332" y="298" class="d-sub">zeroes the session's key copy</text>
  <text x="332" y="316" class="d-sub">
    using disposal calls lock() at scope exit
  </text>

  <rect class="d-node" x="220" y="348" width="200" height="64" rx="16" />
  <text x="320" y="374" text-anchor="middle">Locked</text>
  <text x="320" y="393" text-anchor="middle" class="d-sub">
    permanent; there is no unlock
  </text>

  <text x="320" y="456" text-anchor="middle" class="d-note">
    Signing after lock() throws SESSION_LOCKED; a new signature needs a new
    session.
  </text>
</svg>
