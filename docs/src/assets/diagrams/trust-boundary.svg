<svg
  class="mera-diagram"
  height="276"
  role="img"
  viewBox="0 0 680 276"
  width="680"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>
    The trust boundary. The app runs in a page under the rpId with mera embedded
    in it, and the app holds the derived key in memory. The app reaches the
    authenticator through mera, which runs the WebAuthn ceremonies. The
    authenticator sits outside the page: it holds the passkey and PRF, the key
    never leaves, and it asks for user verification. Any page under the rpId can
    run a ceremony and read the PRF output.
  </title>
  <defs>
    <marker
      id="tb-arrow"
      markerHeight="7"
      markerWidth="7"
      orient="auto-start-reverse"
      refX="8"
      refY="5"
      viewBox="0 0 10 10"
    >
      <path class="d-head" d="M0 0 L10 5 L0 10 z" />
    </marker>
  </defs>

  <rect class="d-zone" height="228" rx="10" width="372" x="24" y="24" />
  <text class="d-sub" x="38" y="46">any page under the rpId</text>

  <rect class="d-node" height="140" rx="8" width="324" x="48" y="72" />
  <text text-anchor="middle" x="210" y="98">The app</text>
  <text class="d-sub" text-anchor="middle" x="210" y="117">
    holds the derived key in memory
  </text>

  <rect class="d-node" height="52" rx="8" width="276" x="72" y="136" />
  <text text-anchor="middle" x="210" y="167">mera</text>

  <path
    class="d-edge"
    d="M348 162 H478"
    marker-end="url(#tb-arrow)"
    marker-start="url(#tb-arrow)"
  />
  <text class="d-sub" text-anchor="middle" x="440" y="152">WebAuthn</text>
  <text class="d-sub" text-anchor="middle" x="440" y="182">ceremonies</text>

  <rect class="d-secret" height="140" rx="8" width="180" x="484" y="92" />
  <text text-anchor="middle" x="574" y="128">Authenticator</text>
  <text class="d-sub" text-anchor="middle" x="574" y="150">
    holds the passkey and PRF
  </text>
  <text class="d-sub" text-anchor="middle" x="574" y="168">
    the key never leaves
  </text>
  <text class="d-sub" text-anchor="middle" x="574" y="186">
    asks for user verification
  </text>
</svg>
